[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cat-layer-studio"
version = "0.1.0"
description = "Precisely fit generated cat parts to a canonical canvas."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "numpy>=2.0",
  "Pillow>=10.4",
  "PySide6>=6.8",
]

[project.optional-dependencies]
alignment = ["opencv-python-headless>=4.10"]
dev = ["pytest>=8.3", "pytest-cov>=5", "ruff>=0.8"]

[project.scripts]
cat-layer-studio = "cat_layer_studio.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cat_layer_studio"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
